version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: wasla_postgres
    restart: always
    environment:
      POSTGRES_USER: wasla_admin
      POSTGRES_PASSWORD: wasla_password_123
      POSTGRES_DB: wasla_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wasla_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
